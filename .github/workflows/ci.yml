name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: bekon-agent (debug build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        run: ./gradlew :bekon-agent:assemblePlayStoreDebug :bekon-agent:testPlayStoreDebugUnitTest --no-daemon
